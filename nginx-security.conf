# Cabecalhos de seguranca do portal. Incluido em cada bloco do server (ver a
# nota sobre a heranca de add_header no nginx.conf). Todos com `always` para
# valerem tambem nas respostas de erro.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
