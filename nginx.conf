server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do servidor.
    server_tokens off;

    # ------------------------------------------------------------------------
    # Cabecalhos de seguranca — via snippet incluido em CADA bloco.
    #
    # Gotcha do nginx: `add_header` num `location` anula a heranca dos add_header
    # do nivel acima. Como a SPA serve o index.html (que tem seu proprio
    # Cache-Control) para toda rota, os headers do `server` sumiam do documento
    # principal. Incluir o snippet em cada bloco garante que sempre aparecam.
    #
    # A CSP e restritiva porque a pagina precisa de muito pouco: nao carrega
    # fonte externa, nao chama CDN. A unica origem externa e a das Edge
    # Functions; o QR chega como data URI. `no-referrer` importa mais aqui do que
    # no site medio: a URL CONTEM o token do link.
    # ------------------------------------------------------------------------
    include /etc/nginx/snippets/portal-security.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets tem hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        include /etc/nginx/snippets/portal-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O HTML nunca e cacheado: e por ele que uma versao nova chega.
    location = /index.html {
        include /etc/nginx/snippets/portal-security.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Fallback de SPA: /{instancia}?t=... e rota do cliente, nao arquivo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nao serve arquivo oculto (.env, .git) caso algum escape para a imagem.
    location ~ /\. {
        deny all;
        return 404;
    }
}
