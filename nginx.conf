server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do servidor.
    server_tokens off;

    # ------------------------------------------------------------------------
    # Cabecalhos de seguranca
    #
    # A CSP e restritiva porque a pagina precisa de muito pouco: nao carrega
    # fonte externa, nao chama CDN, nao embute nada. A unica origem externa e a
    # das Edge Functions, e o QR chega como data URI.
    # ------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # `no-referrer` importa mais aqui do que no site medio: a URL CONTEM o token
    # do link. Sem isso, qualquer recurso externo receberia o token no header
    # Referer.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Toda URL e um link privado de vida curta.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets tem hash no nome: podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O HTML nunca e cacheado: e por ele que uma versao nova chega.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Fallback de SPA: /{instancia}?t=... e rota do cliente, nao arquivo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nao serve arquivo oculto (.env, .git) caso algum escape para a imagem.
    location ~ /\. {
        deny all;
        return 404;
    }
}
