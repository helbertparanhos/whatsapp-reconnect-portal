<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reconectar WhatsApp</title>
    <meta name="description" content="Pagina de reconexao de WhatsApp, acessada por link direto." />

    <!--
      Toda URL deste site e um link privado, de vida curta. Indexar seria expor
      identificadores de instancia em mecanismo de busca.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!--
      O link e enviado por WhatsApp, que busca a pagina para montar a previa. As
      tags abaixo controlam o que aparece nessa previa — e por isso NAO podem
      conter nome de cliente, identificador de instancia nem qualquer dado da
      operacao. Texto generico de proposito.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Reconectar WhatsApp" />
    <meta property="og:description" content="Abra o link e reconecte seu WhatsApp em poucos passos." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reconectar WhatsApp" />
    <meta name="twitter:description" content="Abra o link e reconecte seu WhatsApp em poucos passos." />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161c24" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
